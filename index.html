<!DOCTYPE html>
<html>
<head>
  <title>Dream Ladders AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Dream Ladders AI 🏗️</h1>

  <div class="card">
    <h2>House Cost Estimator</h2>

    <input id="area" placeholder="Built-up Area (sqft)">
    <input id="floors" placeholder="Floors">
    <input id="material" placeholder="Material Level (1-3)">

    <button onclick="predictCost()">Predict Cost</button>

    <h3 id="result">Result: --</h3>
  </div>

  <div class="card">
    <h2>AI Assistant</h2>

    <textarea id="chatInput" placeholder="Ask anything..."></textarea>
    <button onclick="askAI()">Ask AI</button>

    <p id="chatResult">---</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
